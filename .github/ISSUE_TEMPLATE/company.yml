name: Share a company
description: A company you added or fixed in myJobs - sent from the app's "Share with myJobs" button.
title: "Add company: "
labels: [contribution]
body:
  - type: markdown
    attributes:
      value: |
        myJobs filled this in. It holds only the company's public details (name, website,
        careers page, how its jobs are pulled) and the app version - nothing about you.
        Press **Create** and a check runs on its own. A requested company is then wired and
        checked by the maintainer; a company that already has a connector must return real
        postings, and is opened as a pull request for review. Once shipped, every myJobs
        install gets the company the next day.
  - type: textarea
    id: payload
    attributes:
      label: Payload
      description: Filled in by myJobs. Please leave it as it is.
      render: json
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Anything to add? (optional)
